# Replace the corresponding source lines in your existing [stream] section.
# Enable Snapserver's TCP JSON-RPC control listener on port 1705 as well.
# Ports 4953 and 1705 must be reachable by snapnotify on the Docker network.
[stream]
default_source = Mixed
bind_to_address = 0.0.0.0
port = 1704

source = pipe:///tmp/snapfifo?name=mpd&codec=null
source = tcp://0.0.0.0:4953?name=notifications&codec=flac&sampleformat=48000:16:2
source = meta:///notifications/mpd?name=Mixed&codec=flac

sampleformat = 48000:16:2
buffer = 350
send_to_muted = false

# Without MPD, omit the mpd and Mixed source lines and use:
# default_source = notifications
